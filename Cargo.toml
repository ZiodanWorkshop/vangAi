[workspace]
resolver = "2"
members = [
    "crates/harbor-core",
    "crates/harbor-sandbox-linux",
    "crates/harbor-infer",
    "apps/harbor",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
